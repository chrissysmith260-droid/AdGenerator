name: Deploy book page

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zero_cost_ad_pipeline.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Generate author library
        run: python3 zero_cost_ad_pipeline.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload book page
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy book page
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow search engines
        run: |
          python3 -c 'import zero_cost_ad_pipeline as pipeline; print(pipeline.render_indexnow_payload())' \
            | curl --fail-with-body --silent --show-error \
              -X POST https://api.indexnow.org/indexnow \
              -H 'Content-Type: application/json; charset=utf-8' \
              --data-binary @-